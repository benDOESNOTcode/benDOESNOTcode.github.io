<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beniel Immanuel — Fossil Hall</title>
<meta name="description" content="Walk through a pixel-art fossil hall. Reach a dinosaur exhibit to open a project by Beniel Immanuel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#3a2a1e; --wall-2:#4a3526; --floor:#5a3d24; --floor-2:#6b4a2c; --trim:#8a5a2e;
  --ink:#140d08; --panel:#2b1d12; --panel-2:#3d2a1a; --accent:#ffd24a; --accent-2:#ff8a3d;
  --teal:#58e0b8; --bone:#ece0c4; --cream:#f6e9c9;
  --pixel:'Press Start 2P',monospace; --body:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#0c0804;font-family:var(--body);color:var(--cream);overflow:hidden;touch-action:none;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}

#stage{position:relative;width:100%;height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#1a1109 0%,#2a1c10 70%,#1a1109 100%);}

/* scrolling hall */
#hall{position:absolute;top:0;bottom:0;left:0;will-change:transform;}
.ceiling{position:absolute;top:0;left:0;height:12%;width:100%;
  background:repeating-linear-gradient(90deg,#241812 0 28px,#2d2016 28px 32px);border-bottom:6px solid var(--ink);}
.wall{position:absolute;top:12%;left:0;height:58%;width:100%;
  background:
   repeating-linear-gradient(90deg,transparent 0 92px,rgba(0,0,0,.22) 92px 100px),
   repeating-linear-gradient(0deg,transparent 0 60px,rgba(0,0,0,.18) 60px 66px),
   linear-gradient(180deg,var(--wall-2),var(--wall));}
.floor{position:absolute;top:70%;bottom:0;left:0;width:100%;
  background:repeating-linear-gradient(90deg,var(--floor) 0 54px,var(--floor-2) 54px 58px);
  border-top:8px solid var(--trim);box-shadow:inset 0 10px 24px rgba(0,0,0,.4);}
.rug{position:absolute;top:68%;height:5%;left:0;width:100%;background:
  repeating-linear-gradient(90deg,#7a2f2f 0 20px,#8f3a3a 20px 40px);opacity:.5;}

/* lamps + beams */
.lamp{position:absolute;top:11.5%;width:26px;height:16px;background:#1a1109;border:3px solid #0a0704;
  transform:translateX(-50%);}
.lamp::after{content:"";position:absolute;left:50%;top:10px;width:14px;height:10px;transform:translateX(-50%);
  background:var(--accent);box-shadow:0 0 14px 6px rgba(255,210,74,.5);}
.beam{position:absolute;top:13%;height:58%;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,210,74,.26),rgba(255,210,74,0));
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.5;transition:opacity .25s;}
.exhibit.active .beam{opacity:1;}

/* exhibits */
.exhibit{position:absolute;bottom:25%;transform:translateX(-50%);display:flex;flex-direction:column;
  align-items:center;text-align:center;}
.case{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 10px 6px;
  border:4px solid rgba(255,255,255,.12);border-bottom:0;background:linear-gradient(180deg,rgba(120,200,255,.05),rgba(120,200,255,.0));}
.fossil{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));transition:transform .2s;}
.exhibit.active .fossil{transform:translateY(-6px);}
.plinth{width:132px;height:30px;background:linear-gradient(180deg,#6a6258,#3e392f);
  border:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.35);}
.plaque{margin-top:12px;font-family:var(--pixel);font-size:9px;color:var(--ink);background:var(--trim);
  border:3px solid var(--ink);padding:8px 10px;max-width:190px;line-height:1.5;box-shadow:3px 3px 0 rgba(0,0,0,.4);}
.plaque small{display:block;color:#3a2410;font-size:7px;margin-top:6px;letter-spacing:1px;}
.prompt{position:absolute;top:-46px;left:50%;transform:translateX(-50%);font-family:var(--pixel);font-size:8px;
  color:var(--ink);background:var(--accent);border:3px solid var(--ink);padding:7px 9px;white-space:nowrap;
  opacity:0;transition:opacity .15s,transform .15s;box-shadow:2px 2px 0 var(--ink);}
.exhibit.active .prompt{opacity:1;animation:pbob 1s ease-in-out infinite;}
@keyframes pbob{50%{transform:translate(-50%,-4px);}}

/* player */
#player{position:absolute;bottom:8%;z-index:30;transform:translateX(-50%);will-change:left;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;
  align-items:flex-start;padding:16px 18px;pointer-events:none;}
.title{font-family:var(--pixel);font-size:15px;color:var(--cream);text-shadow:3px 3px 0 #000;line-height:1.5;}
.title small{display:block;font-family:var(--pixel);font-size:7px;color:var(--accent);margin-top:7px;letter-spacing:1px;}
.menu{display:flex;gap:9px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;}
.pbtn{font-family:var(--pixel);font-size:9px;padding:10px 11px;color:var(--cream);background:var(--panel);
  border:4px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),4px 4px 0 var(--ink);}
.pbtn:hover{background:var(--panel-2);}
.pbtn:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),2px 2px 0 var(--ink);}

#progress{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;display:flex;gap:6px;pointer-events:none;}
#progress i{width:9px;height:9px;background:rgba(255,255,255,.22);border:2px solid #000;}
#progress i.on{background:var(--accent);}

/* walk controls */
.walkbtn{position:fixed;bottom:20px;z-index:45;width:66px;height:66px;font-family:var(--pixel);font-size:20px;
  color:var(--ink);background:var(--accent);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;}
#left{left:16px;} #right{right:16px;}
.walkbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}

#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;font-family:var(--pixel);
  font-size:9px;color:var(--cream);background:rgba(0,0,0,.72);padding:10px 14px;border:4px solid var(--accent);
  text-shadow:2px 2px 0 #000;}
#hint.hide{display:none;}

/* MODAL */
#overlay{position:fixed;inset:0;z-index:60;background:rgba(6,4,2,.86);display:none;align-items:center;justify-content:center;padding:18px;}
#overlay.open{display:flex;}
.modal{width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border:5px solid var(--ink);
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.4),8px 8px 0 var(--ink);}
.modal-top{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--panel-2);border-bottom:5px solid var(--ink);}
.modal-top .mt{flex:1;}
.modal-top h2{font-family:var(--pixel);font-size:13px;color:var(--accent);line-height:1.5;}
.modal-top .kind{font-family:var(--pixel);font-size:8px;color:var(--teal);margin-top:7px;letter-spacing:1px;}
#closeBtn{font-family:var(--pixel);font-size:11px;color:var(--cream);padding:8px 11px;background:var(--accent-2);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);}
#closeBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.modal-body{padding:18px;font-size:21px;line-height:1.4;}
.modal-body p{margin-bottom:15px;}
.mtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.mtag{font-family:var(--pixel);font-size:8px;padding:7px 9px;background:var(--ink);color:var(--teal);}
.mlinks{display:flex;flex-wrap:wrap;gap:12px;}
.mlink{font-family:var(--pixel);font-size:10px;padding:12px 14px;color:var(--ink);background:var(--accent);
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:inline-flex;gap:8px;}
.mlink.alt{background:var(--teal);} .mlink:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;font-size:20px;}
.skill-grid b{font-family:var(--pixel);font-size:9px;color:var(--accent);margin:9px 0 3px;grid-column:1/-1;}
.credit{margin-top:18px;font-size:16px;color:#a99;line-height:1.4;}
.credit a{color:var(--teal);}

@media(max-width:720px){ .title{font-size:12px;} .menu .pbtn{font-size:8px;padding:8px 8px;} }
@media(prefers-reduced-motion:reduce){ .exhibit.active .prompt{animation:none;} }
</style>
</head>
<body>
<div id="stage">
  <div id="hall">
    <div class="ceiling"></div>
    <div class="wall"></div>
    <div class="rug"></div>
    <div class="floor"></div>
  </div>

</div>

<div id="hud">

<script>
/* ---------- fossil renderer (Redshrike CC-BY sprite sheet) ---------- */
var FB={trex:[4,5,94,83],trilobite:[99,30,48,46],skull:[150,2,70,86],croc:[223,28,118,58],ptero:[350,1,92,87]};
var VAR={
  trex:{box:'trex'}, trex_b:{box:'trex',tint:[0.82,0.85,0.95],flip:1},
  ptero:{box:'ptero'}, ptero_b:{box:'ptero',tint:[0.90,0.80,0.62],flip:1},
  trilo:{box:'trilobite'}, trilo_b:{box:'trilobite',tint:[0.90,0.80,0.62]},
  skull:{box:'skull'}, skull_b:{box:'skull',tint:[0.95,0.80,0.74]},
  croc:{box:'croc'}, croc_b:{box:'croc',tint:[0.82,0.85,0.95],flip:1}
};
var sheet=new Image(), sheetReady=false, _pending=[];
sheet.onload=function(){sheetReady=true;_pending.forEach(function(f){f();});_pending=[];};
sheet.src='images/redshrike-fossils.png';
function drawFossilBox(canvas,boxName,maxW,maxH,tint,flip){
  if(!sheetReady){_pending.push(function(){drawFossilBox(canvas,boxName,maxW,maxH,tint,flip);});return;}
  var b=FB[boxName]||FB.trex, w=b[2], h=b[3];
  var off=document.createElement('canvas'); off.width=w; off.height=h;
  var o=off.getContext('2d'); o.imageSmoothingEnabled=false;
  o.drawImage(sheet,b[0],b[1],w,h,0,0,w,h);
  var im=o.getImageData(0,0,w,h), d=im.data, br=d[0],bg=d[1],bb=d[2];
  for(var i=0;i<d.length;i+=4){
    var x=d[i]-br,y=d[i+1]-bg,z=d[i+2]-bb;
    if(x*x+y*y+z*z<3600){ d[i+3]=0; }
    else if(tint){ d[i]*=tint[0]; d[i+1]*=tint[1]; d[i+2]*=tint[2]; }
  }
  o.putImageData(im,0,0);
  var sc=Math.min(maxW/w,maxH/h), dw=Math.round(w*sc), dh=Math.round(h*sc);
  canvas.width=w; canvas.height=h; canvas.style.width=dw+'px'; canvas.style.height=dh+'px';
  var c=canvas.getContext('2d'); c.imageSmoothingEnabled=false; c.clearRect(0,0,w,h);
  if(flip){ c.translate(w,0); c.scale(-1,1); }
  c.drawImage(off,0,0);
}
function drawFossil(canvas,key,maxH){ var v=VAR[key]||VAR.trex; drawFossilBox(canvas,v.box,maxH*1.7,maxH,v.tint,v.flip); }

/* ---------- stickman ---------- */
function drawStick(canvas,frame){
  var res=44; canvas.width=res; canvas.height=64;
  canvas.style.width='46px'; canvas.style.height='66px';
  var ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  function fig(col,lw,hr){
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
    var cx=22;
    ctx.beginPath(); ctx.arc(cx,14,hr,0,7); ctx.fill();                 /* head */
    ctx.beginPath(); ctx.moveTo(cx,21); ctx.lineTo(cx,41); ctx.stroke();/* body */
    var a=frame===1?4:(frame===2?-4:0);
    ctx.beginPath(); ctx.moveTo(cx,26); ctx.lineTo(cx-10,35+a); ctx.moveTo(cx,26); ctx.lineTo(cx+10,35-a); ctx.stroke();
    var l=frame===1?8:(frame===2?-8:5);
    ctx.beginPath(); ctx.moveTo(cx,41); ctx.lineTo(cx-l,59); ctx.moveTo(cx,41); ctx.lineTo(cx+l,59); ctx.stroke();
  }
  fig('#140d06',8,9);    /* dark outline */
  fig('#f6ecd2',3.5,6);  /* cream body */
}

/* ---------- content ---------- */
var EX=[
 {fossil:'trex',   species:'TYRANNOSAURUS',  title:'AGENTIC BI DASHBOARD', kind:'DATA ENGINEERING',
  body:"A fully containerized e-commerce analytics stack — Airflow orchestrating a PySpark ETL into a PostgreSQL star schema, surfaced through a React dashboard with a FastAPI + local-LLM layer that turns plain questions into SQL.",
  tags:['AIRFLOW','PYSPARK','POSTGRES','DOCKER','FASTAPI'], code:'https://github.com/benDOESNOTcode/Agentic-BI-Dashboard', big:1},
 {fossil:'ptero', species:'PTERANODON',      title:'AVIAN CLIMATE INTEL', kind:'AGENTIC AI · BIRDS',
  body:"A serverless multi-agent system that answers plain-English questions about bird populations — routing each query to semantic search, text-to-SQL, forecasting, or a self-correcting chart engine, and rendering 20-year migration maps in WebGL.",
  tags:['LANGGRAPH','RAG','DUCKDB','GROQ','PYDECK'], code:'https://github.com/benDOESNOTcode/avian-climate-agent'},
 {fossil:'trilo',      species:'TRILOBITE',        title:'TOXIC WATERS', kind:'GEOSPATIAL · OCEANS',
  body:"A multi-decade study of how microplastic pollution and commercial fishing reshape ocean phytoplankton — the microbes behind half of Earth's oxygen. Integrates three global datasets into a 56-million-row spatiotemporal pipeline.",
  tags:['GEOPANDAS','PANDAS','56M ROWS','NCEI'], code:'https://github.com/benDOESNOTcode/Marine'},
 {fossil:'skull',species:'DIRE SKULL',   title:'ATLAS QUERY', kind:'NL → SQL · MAPS',
  body:"Ask US county geographic data in plain English and watch the answer draw itself on an interactive map. A PostGIS-backed engine converts natural language to spatial SQL; a React + D3 frontend renders results as live GeoJSON.",
  tags:['FASTAPI','POSTGIS','REACT','D3.JS'], code:'https://github.com/benDOESNOTcode/Atlas-Query'},
 {fossil:'croc',  species:'DEINOSUCHUS',     title:'CHESS DATA PIPELINE', kind:'DATA ENGINEERING',
  body:"Pulls games from the Chess.com API into a medallion-style warehouse — DuckDB, dbt transformations, and a Streamlit + Plotly dashboard tracking rating over time.",
  tags:['CHESS.COM API','DUCKDB','DBT','STREAMLIT'], code:'https://github.com/benDOESNOTcode/chess-data-pipeline'},
 {fossil:'trex_b',species:'ALBERTOSAURUS',  title:'HOTEL ANALYTICS ETL', kind:'DATA ENGINEERING',
  body:"An end-to-end PySpark ETL cleaning four years of hotel reservation data into a normalized PostgreSQL schema, served through a Flask API and dashboard. Built for UC Riverside's CS 236.",
  tags:['PYSPARK','POSTGRES','FLASK','DOCKER'], code:'https://github.com/benDOESNOTcode/End-to-End-ETL-and-Data-Pipeline-Hotel-Data-'},
 {fossil:'trilo_b',     species:'TRILOBITE',        title:'ORDER FLOW IMBALANCE', kind:'QUANT · SIGNALS',
  body:"Computes OFI features from high-frequency limit-order-book data — quantifying short-term buying vs. selling pressure, a core signal in market-microstructure models.",
  tags:['PYTHON','NUMPY','MARKET DATA'], code:'https://github.com/benDOESNOTcode/Blockhouse_OFI'},
 {fossil:'skull_b',   species:'CAVE BEAST',        title:'INTRUSION DETECTION', kind:'MACHINE LEARNING',
  body:"A deep neural network that classifies network traffic on the ECU-IoHT healthcare dataset into five attack types — reproducing an IEEE Access paper and reaching ~99.9% accuracy across 111k packets.",
  tags:['TENSORFLOW','KERAS','DNN','99.9% ACC'], code:'https://github.com/benDOESNOTcode/Intrusion_detection_system'},
 {fossil:'croc_b',  species:'SARCOSUCHUS',       title:'DARWINIAN BLOBS', kind:'ML · SIMULATION',
  body:"An evolutionary simulation where agents compete at iterated rock-paper-scissors using six strategies — from biased heuristics to Q-learning, an MLP, and an LSTM built in PyTorch.",
  tags:['PYTORCH','RL','LSTM','SIM'], code:'https://github.com/benDOESNOTcode/darwinian_blobs'},
 {fossil:'ptero_b',  species:'PTERODACTYL',     title:'BLACKJACK', kind:'FOR FUN',
  body:"A complete command-line blackjack engine — shuffling, betting, correct Ace handling, and a dealer that hits to 17. Made for the fun of it (and yes, hitting on soft 17 works).",
  tags:['PYTHON','CARD GAME'], code:'https://github.com/benDOESNOTcode/blackjack'}
];
var PANELS={
 about:{fossil:'skull',title:'ABOUT',kind:'CURATOR',
  body:"I'm Beniel Immanuel, a graduate student in Computational Data Science at UC Riverside, drawn to problems where data meets the natural world. I work in Python, SQL and Java — building the pipelines, models and agents mounted in this hall. Before Riverside I earned a B.E. in Electrical Engineering from VIT Vellore, India. Off the clock: the gym and blackjack.",
  links:[['LINKEDIN','https://www.linkedin.com/in/beniel-immanuel/','alt']]},
 contact:{fossil:'ptero',title:'CONTACT',kind:'SEND A SIGNAL',
  body:"Open to data science and ML roles, research collaborations, and good conversations about the living world.",
  links:[['EMAIL','mailto:beniels2713@gmail.com',''],['LINKEDIN','https://www.linkedin.com/in/beniel-immanuel/','alt'],['GITHUB','https://github.com/benDOESNOTcode','alt']]},
 skills:{fossil:'trex',title:'SKILLS',kind:'TOOL KIT',skills:{
  'LANGUAGES':['Python','SQL','Java','TypeScript'],'DATA ENG':['Spark','Airflow','dbt','DuckDB','PostGIS','Docker'],
  'ML & AI':['TensorFlow','PyTorch','LangGraph','RAG / Qdrant'],'VIZ':['Pandas','GeoPandas','Plotly','D3.js','Streamlit']}}
};

/* ---------- build hall ---------- */
var hall=document.getElementById('hall');
var GAP=440, PAD=360, FLOORY;
var worldW=PAD*2+(EX.length-1)*GAP;
hall.style.width=worldW+'px';
['ceiling','wall','rug','floor'].forEach(function(c){hall.querySelector('.'+c).style.width=worldW+'px';});

EX.forEach(function(e,i){
  var x=PAD+i*GAP; e._x=x;
  var lamp=document.createElement('div'); lamp.className='lamp'; lamp.style.left=x+'px'; hall.appendChild(lamp);
  var beam=document.createElement('div'); beam.className='beam';
  var ex=document.createElement('div'); ex.className='exhibit'; ex.style.left=x+'px'; ex.dataset.i=i;
  var size=e.big?150:118;
  var prompt=document.createElement('div'); prompt.className='prompt'; prompt.textContent='▲ VIEW';
  var caseEl=document.createElement('div'); caseEl.className='case'; caseEl.style.height=(size+14)+'px';
  var cv=document.createElement('canvas'); cv.className='fossil'; drawFossil(cv,e.fossil,size);
  caseEl.appendChild(cv);
  var plinth=document.createElement('div'); plinth.className='plinth';
  var plaque=document.createElement('div'); plaque.className='plaque'; plaque.innerHTML=e.species+'<small>'+e.title+'</small>';
  ex.appendChild(beam); ex.appendChild(prompt); ex.appendChild(caseEl); ex.appendChild(plinth); ex.appendChild(plaque);
  ex.addEventListener('click',function(){openProject(i);});
  hall.appendChild(ex);
  e._el=ex;
});

/* progress dots */
var prog=document.getElementById('progress');
EX.forEach(function(){var i=document.createElement('i');prog.appendChild(i);});

/* ---------- player + camera ---------- */
var player=document.getElementById('player');
var pos=150, vw=window.innerWidth, dir=0, vel=0, face=1, frame=0, walkT=0, nearest=-1;
addEventListener('resize',function(){vw=window.innerWidth;});
drawStick(player,0);

function loop(){
  if(dir!==0) vel+=dir*0.85; else vel*=0.80;
  if(vel>5.2)vel=5.2; else if(vel<-5.2)vel=-5.2;
  if(Math.abs(vel)<0.08)vel=0;
  if(vel!==0){ pos+=vel; if(pos<80){pos=80;vel=0;} else if(pos>worldW-80){pos=worldW-80;vel=0;} }
  var moving=Math.abs(vel)>0.4, bob=0;
  if(moving){
    face=vel<0?-1:1;
    walkT+=Math.abs(vel);
    var f=(Math.floor(walkT/11)%2)?1:2;
    if(f!==frame){frame=f; drawStick(player,frame);}
    bob=Math.abs(Math.sin(walkT/11))*3;
  } else if(frame!==0){frame=0; drawStick(player,0);}
  player.style.transform='translateX(-50%) translateY('+(-bob)+'px) scaleX('+face+')';
  var cam=Math.max(0,Math.min(pos-vw/2,worldW-vw));
  hall.style.transform='translateX('+(-cam)+'px)';
  player.style.left=(pos-cam)+'px';
  var best=-1,bd=175;
  for(var i=0;i<EX.length;i++){var dd=Math.abs(EX[i]._x-pos); if(dd<bd){bd=dd;best=i;}}
  if(best!==nearest){
    if(nearest>=0)EX[nearest]._el.classList.remove('active');
    if(best>=0)EX[best]._el.classList.add('active');
    prog.children[nearest]&&prog.children[nearest].classList.remove('on');
    prog.children[best]&&prog.children[best].classList.add('on');
    nearest=best;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- controls ---------- */
var keys={};
addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'){dir=-1;hideHint();}
  else if(e.key==='ArrowRight'||e.key==='d'){dir=1;hideHint();}
  else if((e.key==='ArrowUp'||e.key==='Enter'||e.key===' ')&&nearest>=0&&!overlay.classList.contains('open')){e.preventDefault();openProject(nearest);}
  else if(e.key==='Escape'&&overlay.classList.contains('open'))close();
});
addEventListener('keyup',function(e){
  if((e.key==='ArrowLeft'||e.key==='a')&&dir===-1)dir=0;
  if((e.key==='ArrowRight'||e.key==='d')&&dir===1)dir=0;
});
function hold(btn,d){
  var set=function(e){e.preventDefault();dir=d;hideHint();};
  var clr=function(){if(dir===d)dir=0;};
  btn.addEventListener('mousedown',set); btn.addEventListener('touchstart',set,{passive:false});
  addEventListener('mouseup',clr); btn.addEventListener('touchend',clr); btn.addEventListener('touchcancel',clr);
}
hold(document.getElementById('left'),-1);
hold(document.getElementById('right'),1);
function hideHint(){var h=document.getElementById('hint');if(h)h.classList.add('hide');}

/* ---------- modal ---------- */
var overlay=document.getElementById('overlay'),mTitle=document.getElementById('mTitle'),
    mKind=document.getElementById('mKind'),mBody=document.getElementById('mBody'),mSprite=document.getElementById('mSprite'),lastFocus=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function openProject(i){
  var e=EX[i]; mTitle.textContent=e.title; mKind.textContent=e.species+' · '+e.kind;
  drawFossil(mSprite,e.fossil,64);
  var h='<p>'+esc(e.body)+'</p><div class="mtags">';
  e.tags.forEach(function(t){h+='<span class="mtag">'+esc(t)+'</span>';});
  h+='</div><div class="mlinks"><a class="mlink" href="'+e.code+'" target="_blank" rel="noopener">&#9654; VIEW CODE</a></div>';
  mBody.innerHTML=h; show();
}
function openPanel(k){
  var p=PANELS[k]; mTitle.textContent=p.title; mKind.textContent=p.kind; drawFossil(mSprite,p.fossil,64);
  var h='';
  if(p.skills){h+='<div class="skill-grid">';for(var key in p.skills){h+='<b>'+esc(key)+'</b>';p.skills[key].forEach(function(s){h+='<span>'+esc(s)+'</span>';});}h+='</div>';}
  else h+='<p>'+esc(p.body)+'</p>';
  if(p.links){h+='<div class="mlinks">';p.links.forEach(function(l){h+='<a class="mlink '+(l[2]||'')+'" href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>';});h+='</div>';}
  if(k==='about')h+='<p class="credit">Fossil skeletons from <a href="https://opengameart.org" target="_blank" rel="noopener">OpenGameArt.org</a> (Redshrike) — CC BY 3.0.</p>';
  mBody.innerHTML=h; show();
}
function show(){lastFocus=document.activeElement;dir=0;overlay.classList.add('open');document.getElementById('closeBtn').focus();}
function close(){overlay.classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.getElementById('closeBtn').addEventListener('click',close);
overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
document.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){openPanel(b.getAttribute('data-open'));});});
</script>
</body>
</html>
